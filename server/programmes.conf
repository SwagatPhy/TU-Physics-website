# Roll-number prefix -> programme. One line per prefix: PREFIX  Programme name
# This is the ONLY place prefixes are defined; registration, the admin page
# and the roster import all read this file.
#
# A student roll number is the prefix, the 2-digit joining year and a 3-digit
# serial, with nothing in between: PHP22017 = PhD, joined 2022, number 017.
# The joining year gives the student's batch (programme + year).
PHM  MSc
PHI  Integrated BSc-MSc
PHP  PhD
